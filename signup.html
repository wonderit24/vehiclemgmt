<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DELSPARK | Create account</title><link rel="stylesheet" href="login.css"></head>
<body><main class="login-card"><div class="mark">D</div><p class="eyebrow">DELTA STATE UNIVERSITY, ABRAKA</p><h1>Create your account</h1><p>Vehicle Owners can register and manage their own parking records.</p>
<form id="signup-form"><label>Full name<input type="text" id="name" required autocomplete="name" placeholder="Your full name"></label><label>Email<input type="email" id="email" required autocomplete="email" placeholder="you@delsu.edu.ng"></label><label>Password<input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button id="signup-button" type="submit">Create account</button><p id="error" role="alert"></p></form><p class="signup-link">Already have an account? <a href="/login">Sign in</a></p></main>
<script>const form=document.querySelector('#signup-form'),nameInput=document.querySelector('#name'),emailInput=document.querySelector('#email'),passwordInput=document.querySelector('#password'),errorBox=document.querySelector('#error'),button=document.querySelector('#signup-button');form.addEventListener('submit',async event=>{event.preventDefault();errorBox.textContent='';if(location.protocol==='file:'){errorBox.textContent='Start the app server, then open http://127.0.0.1:5000.';return}button.disabled=true;button.textContent='Creating account…';try{const response=await fetch('/api/auth/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nameInput.value.trim(),email:emailInput.value.trim(),password:passwordInput.value})});const type=response.headers.get('content-type')||'';const data=type.includes('application/json')?await response.json():{};if(!response.ok)throw new Error(data.error||'Unable to create account');window.location.assign('/')}catch(error){errorBox.textContent=error.message}finally{button.disabled=false;button.textContent='Create account'}});</script></body></html>
